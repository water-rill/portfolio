<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音控作品集</title>
<style>
  :root {
    --bg: #12161b;
    --ink: #eaf0f6;
    --dim: #8595a8;
    --line: #232b35;
    --accent: #4a90d9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 68px 26px 96px; }

  header { margin-bottom: 56px; }

  h1 {
    font-size: clamp(34px, 7vw, 50px);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.1;
  }

  .sub { margin-top: 12px; font-size: 15.5px; color: var(--dim); letter-spacing: 0.05em; }

  .rule { width: 44px; height: 3px; background: var(--accent); margin-top: 26px; }

  .track { padding: 30px 0; border-top: 1px solid var(--line); }
  .track:last-of-type { border-bottom: 1px solid var(--line); }

  .track h2 { font-size: 21px; font-weight: 600; letter-spacing: 0.03em; }

  .meta { margin-top: 6px; font-size: 13.5px; color: var(--dim); letter-spacing: 0.04em; }

  .ab { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  .ab-label { font-size: 12.5px; color: var(--dim); letter-spacing: 0.06em; margin-right: 2px; }

  .ab button {
    font: inherit; font-size: 12.5px; letter-spacing: 0.04em;
    padding: 6px 14px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    cursor: pointer; border-radius: 0;
    transition: border-color .16s, color .16s, background .16s;
  }
  .ab button:hover { border-color: #3a4b5f; color: var(--ink); }
  .ab button.on { background: var(--accent); border-color: var(--accent); color: #08121c; font-weight: 600; }
  .ab button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .ab-note { margin-top: 10px; font-size: 12.5px; color: #6f8095; letter-spacing: 0.03em; }

  .player { display: flex; align-items: center; gap: 15px; margin-top: 18px; }

  .btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    border: 1px solid var(--line);
    background: transparent; color: var(--ink);
    cursor: pointer; display: grid; place-items: center; border-radius: 0;
    transition: border-color .18s, color .18s, background .18s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn svg { width: 15px; height: 15px; fill: currentColor; }
  .btn .icon-pause { display: none; }
  .btn.playing .icon-play { display: none; }
  .btn.playing .icon-pause { display: block; }

  .bar { flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; position: relative; }
  .bar::before { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--line); }
  .fill { position: relative; height: 2px; width: 0%; background: var(--accent); }

  .time {
    font-size: 12.5px; color: var(--dim);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    min-width: 86px; text-align: right;
  }

  footer { margin-top: 66px; font-size: 14px; color: var(--dim); line-height: 2; }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>音控作品集</h1>
    <div class="sub">现场音控 · 录音 · 混音</div>
    <div class="rule"></div>
  </header>

  <section class="works">

    <article class="track" data-srcs="audio/21g-museum.mp3" data-total="4:19">
      <h2>21 克博物馆</h2>
      <div class="meta">翻唱 · 录音 / 剪辑 / 混音</div>
      <div class="player">
        <button class="btn" aria-label="播放">
          <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
          <svg class="icon-pause" viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>
        </button>
        <div class="bar"><div class="fill"></div></div>
        <div class="time">0:00 / 4:19</div>
      </div>
    </article>

    <article class="track" data-srcs="audio/the-absent-light-raw.mp3|audio/the-absent-light.mp3" data-total="4:02">
      <h2>没有的光</h2>
      <div class="meta">分轨混音 · 可切换对比</div>

      <div class="ab">
        <span class="ab-label">版本</span>
        <button class="on" data-ver="0">原分轨直混</button>
        <button data-ver="1">处理后</button>
      </div>
      <div class="ab-note">同一段分轨：未经声像摆位与频段规避处理 → 混音成品</div>

      <div class="player">
        <button class="btn" aria-label="播放">
          <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
          <svg class="icon-pause" viewBox="0 0 16 16"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>
        </button>
        <div class="bar"><div class="fill"></div></div>
        <div class="time">0:00 / 4:02</div>
      </div>
    </article>

  </section>

  <footer>
    音频为工作样带，仅作试听。完整简历与联系方式见投递附件。
  </footer>

</div>

<script>
(function () {
  var allAudios = [];

  function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60);
    var x = Math.floor(s % 60);
    return m + ':' + (x < 10 ? '0' : '') + x;
  }

  function makePlayer(el) {
    var srcs = el.dataset.srcs.split('|');
    var total = el.dataset.total;
    var audios = srcs.map(function (src) {
      var a = new Audio();
      a.preload = 'none';
      a.src = src;
      allAudios.push(a);
      return a;
    });
    var idx = 0;

    var btn = el.querySelector('.btn');
    var bar = el.querySelector('.bar');
    var fill = el.querySelector('.fill');
    var timeEl = el.querySelector('.time');

    function cur() { return audios[idx]; }

    function paint() {
      var a = cur();
      var d = a.duration || 0;
      fill.style.width = (d ? (a.currentTime / d) * 100 : 0) + '%';
      timeEl.textContent = fmt(a.currentTime) + ' / ' + (d ? fmt(d) : total);
    }

    btn.addEventListener('click', function () {
      var a = cur();
      if (a.paused) { a.play(); } else { a.pause(); }
    });

    bar.addEventListener('click', function (e) {
      var a = cur();
      var r = bar.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if (a.duration) { a.currentTime = ratio * a.duration; paint(); }
    });

    audios.forEach(function (a) {
      a.addEventListener('play', function () {
        allAudios.forEach(function (o) { if (o !== a) o.pause(); });
        if (a === cur()) { btn.classList.add('playing'); btn.setAttribute('aria-label', '暂停'); }
      });
      a.addEventListener('pause', function () {
        if (a === cur()) { btn.classList.remove('playing'); btn.setAttribute('aria-label', '播放'); }
      });
      a.addEventListener('timeupdate', function () { if (a === cur()) paint(); });
      a.addEventListener('loadedmetadata', function () { if (a === cur()) paint(); });
      a.addEventListener('ended', function () {
        a.currentTime = 0;
        if (a === cur()) { paint(); btn.classList.remove('playing'); }
      });
    });

    return {
      switchTo: function (nextIdx) {
        if (nextIdx === idx) return;
        var prev = cur();
        var wasPlaying = !prev.paused;
        var t = prev.currentTime;
        prev.pause();
        idx = nextIdx;
        btn.classList.remove('playing');
        var next = cur();

        function seek() {
          try { next.currentTime = t; } catch (err) {}
          paint();
          if (wasPlaying) next.play();
        }

        if (next.readyState >= 1) {
          seek();
        } else {
          next.addEventListener('loadedmetadata', seek, { once: true });
          next.load();
        }
      }
    };
  }

  Array.prototype.forEach.call(document.querySelectorAll('.track'), function (el) {
    var player = makePlayer(el);
    var abBtns = el.querySelectorAll('.ab button');
    Array.prototype.forEach.call(abBtns, function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(abBtns, function (x) { x.classList.remove('on'); });
        btn.classList.add('on');
        player.switchTo(parseInt(btn.dataset.ver, 10));
      });
    });
  });
})();
</script>
</body>
</html>
