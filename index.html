<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品集</title>
<style>
  :root {
    --ink: #14161a;
    --muted: #8a8f96;
    --line: #e6e4e0;
    --bg: #fbfaf8;
    --blue: #3a7bc8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: clamp(48px, 8vh, 88px) clamp(20px, 5vw, 40px) clamp(56px, 9vh, 88px);
  }

  /* 头部 */
  header { margin-bottom: clamp(36px, 6vh, 56px); }

  h1 {
    font-size: clamp(26px, 2.2vw + 18px, 34px);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  .sub {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* 作品 */
  .track {
    padding: clamp(28px, 4.5vh, 40px) 0;
    border-top: 1px solid var(--line);
  }
  .track:last-of-type { border-bottom: 1px solid var(--line); }

  .track h2 {
    font-size: clamp(18px, 1vw + 14px, 21px);
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .meta {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .wave {
    display: block;
    width: 100%;
    height: clamp(52px, 8vw, 76px);
    object-fit: fill;
    margin: clamp(16px, 2.6vh, 22px) 0 0;
    opacity: 0.95;
  }

  /* A/B */
  .ab { margin-top: 16px; display: flex; gap: 8px; }

  .ab button {
    font: inherit;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    padding: 7px 15px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 100px;
    cursor: pointer;
    transition: all .16s ease;
  }
  .ab button:hover { border-color: #c9c5be; color: var(--ink); }
  .ab button.on {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    font-weight: 600;
  }
  .ab button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .ab-note {
    margin-top: 9px;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* 播放器 */
  .player {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 18px;
  }

  .play {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .16s ease;
  }
  .play:hover { background: var(--blue); }
  .play:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .play svg { width: 14px; height: 14px; fill: currentColor; margin-left: 1px; }
  .play .icon-pause { display: none; margin-left: 0; }
  .play.playing .icon-play { display: none; }
  .play.playing .icon-pause { display: block; }

  .bar {
    flex: 1;
    height: 24px;
    display: flex;
    align-items: center;
    cursor: pointer;
    position: relative;
  }
  .bar::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: #e8e5df;
    border-radius: 2px;
  }
  .fill {
    position: relative;
    height: 3px;
    width: 0%;
    background: var(--blue);
    border-radius: 2px;
  }

  .time {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.03em;
    min-width: 82px;
    text-align: right;
  }

  /* 底部 */
  .footer-block {
    margin-top: clamp(36px, 6vh, 52px);
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
  }

  .qr {
    width: 88px;
    height: 88px;
    flex: 0 0 88px;
    background: #fff;
    border: 1px solid var(--line);
    padding: 6px;
  }
  .qr img { width: 100%; height: 100%; }

  .footer-copy { flex: 1; min-width: 200px; }

  .url {
    display: inline-block;
    font-size: 14.5px;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--blue);
    padding-bottom: 1px;
  }
  .url:hover { color: var(--blue); }

  .hint {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .colophon {
    margin-top: clamp(36px, 6vh, 52px);
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: #a8a49d;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>作品集</h1>
    <div class="sub">现场音控 · 录音 · 混音</div>
  </header>

  <article class="track" data-srcs="audio/21g-museum.mp3" data-total="4:19" data-wave="assets/wave-21g.png">
    <h2>21 克博物馆</h2>
    <div class="meta">翻唱 · 录音 / 剪辑 / 混音 · 4:19</div>
    <img class="wave" src="assets/wave-21g.png" alt="21 克博物馆整曲波形">
    <div class="player">
      <button class="play" aria-label="播放">
        <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
        <svg class="icon-pause" viewBox="0 0 16 16"><path d="M4 1.5h3.2v13H4zM8.8 1.5H12v13H8.8z"/></svg>
      </button>
      <div class="bar"><div class="fill"></div></div>
      <div class="time">0:00 / 4:19</div>
    </div>
  </article>

  <article class="track" data-srcs="audio/the-absent-light-raw.mp3|audio/the-absent-light.mp3" data-total="4:02"
           data-wave="assets/wave-abl-raw.png|assets/wave-abl-mix.png">
    <h2>没有的光</h2>
    <div class="meta">分轨混音 · 4:02</div>
    <img class="wave" src="assets/wave-abl-raw.png" alt="没有的光整曲波形">

    <div class="ab">
      <button class="on" data-ver="0">原分轨直混</button>
      <button data-ver="1">处理后</button>
    </div>
    <div class="ab-note">同一段分轨，没做声像摆位和频段规避 vs 处理完的成品。切换时进度保留。</div>

    <div class="player">
      <button class="play" aria-label="播放">
        <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
        <svg class="icon-pause" viewBox="0 0 16 16"><path d="M4 1.5h3.2v13H4zM8.8 1.5H12v13H8.8z"/></svg>
      </button>
      <div class="bar"><div class="fill"></div></div>
      <div class="time">0:00 / 4:02</div>
    </div>
  </article>

  <div class="colophon">音频为工作样带，仅作试听。完整简历与联系方式见投递附件。</div>

</div>

<script>
(function () {
  var allAudios = [];

  function fmt(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    var m = Math.floor(s / 60);
    var x = Math.floor(s % 60);
    return m + ':' + (x < 10 ? '0' : '') + x;
  }

  function makePlayer(el) {
    var srcs = el.dataset.srcs.split('|');
    var waves = (el.dataset.wave || '').split('|');
    var total = el.dataset.total;
    var waveEl = el.querySelector('.wave');

    var audios = srcs.map(function (src) {
      var a = new Audio();
      a.preload = 'none';
      a.src = src;
      allAudios.push(a);
      return a;
    });
    var idx = 0;

    var btn = el.querySelector('.play');
    var bar = el.querySelector('.bar');
    var fill = el.querySelector('.fill');
    var timeEl = el.querySelector('.time');

    function cur() { return audios[idx]; }

    function paint() {
      var a = cur();
      var d = a.duration || 0;
      fill.style.width = (d ? (a.currentTime / d) * 100 : 0) + '%';
      timeEl.textContent = fmt(a.currentTime) + ' / ' + (d ? fmt(d) : total);
    }

    btn.addEventListener('click', function () {
      var a = cur();
      if (a.paused) {
        timeEl.textContent = '加载中…';
        var pr = a.play();
        if (pr && pr.catch) {
          pr.catch(function () { timeEl.textContent = '无法播放，请刷新'; });
        }
      } else {
        a.pause();
      }
    });

    bar.addEventListener('click', function (e) {
      var a = cur();
      var r = bar.getBoundingClientRect();
      var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if (a.duration) { a.currentTime = ratio * a.duration; paint(); }
    });

    audios.forEach(function (a) {
      a.addEventListener('play', function () {
        allAudios.forEach(function (o) { if (o !== a) o.pause(); });
        if (a === cur()) { btn.classList.add('playing'); btn.setAttribute('aria-label', '暂停'); }
      });
      a.addEventListener('pause', function () {
        if (a === cur()) { btn.classList.remove('playing'); btn.setAttribute('aria-label', '播放'); }
      });
      a.addEventListener('timeupdate', function () { if (a === cur()) paint(); });
      a.addEventListener('loadedmetadata', function () { if (a === cur()) paint(); });
      a.addEventListener('playing', function () { if (a === cur()) paint(); });
      a.addEventListener('waiting', function () { if (a === cur()) timeEl.textContent = '缓冲中…'; });
      a.addEventListener('error', function () {
        if (a === cur()) timeEl.textContent = '加载失败，请刷新';
      });
      a.addEventListener('ended', function () {
        a.currentTime = 0;
        if (a === cur()) { paint(); btn.classList.remove('playing'); }
      });
    });

    return {
      switchTo: function (nextIdx) {
        if (nextIdx === idx) return;
        var prev = cur();
        var wasPlaying = !prev.paused;
        var t = prev.currentTime;
        prev.pause();
        idx = nextIdx;
        btn.classList.remove('playing');

        if (waveEl && waves[nextIdx]) waveEl.src = waves[nextIdx];

        var next = cur();

        function seek() {
          try { next.currentTime = t; } catch (err) {}
          paint();
          if (wasPlaying) next.play();
        }

        if (next.readyState >= 1) {
          seek();
        } else {
          next.addEventListener('loadedmetadata', seek, { once: true });
          next.load();
        }
      }
    };
  }

  Array.prototype.forEach.call(document.querySelectorAll('.track'), function (el) {
    var player = makePlayer(el);
    var abBtns = el.querySelectorAll('.ab button');
    Array.prototype.forEach.call(abBtns, function (btn) {
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(abBtns, function (x) { x.classList.remove('on'); });
        btn.classList.add('on');
        player.switchTo(parseInt(btn.dataset.ver, 10));
      });
    });
  });
})();
</script>
</body>
</html>
